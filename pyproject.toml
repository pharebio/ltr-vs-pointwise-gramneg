# Tooling configuration for the learn-to-rank scaffold.
# The code is a flat set of research modules (run from the repo root); there is no
# build step. Install deps with `pip install -r requirements.txt`.

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]  # ambiguous var names (l, I) are fine in short math code

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
